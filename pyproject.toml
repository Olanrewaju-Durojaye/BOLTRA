[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boltzgen-workbench"
version = "1.0.0"
description = "BOLTRA: guided BoltzGen biomolecular design, recovery, and analysis"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["PyYAML>=6", "pandas>=2", "matplotlib>=3.8"]
keywords = ["protein-design", "BoltzGen", "bioinformatics", "computational-biology"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
boltra = "boltzgen_workbench.cli:main"
boltz-workbench = "boltzgen_workbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
